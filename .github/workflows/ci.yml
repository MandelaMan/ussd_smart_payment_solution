name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Unit + process-flow tests
        run: yarn test:ci
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-minimum-32-chars-long!!

      - name: Auth security checks
        run: yarn test:auth-security
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-minimum-32-chars-long!!

      - name: Xtream offline spec
        run: yarn test:xtream-spec

      - name: Admin typecheck / build
        run: yarn build
