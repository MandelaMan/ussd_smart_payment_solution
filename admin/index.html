<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/admin/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#166a82" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SUL Bix" />
    <link rel="apple-touch-icon" href="/admin/pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <title>SUL Bix</title>
    <script>
      /* Splash + brand boot bg only when launched as installed PWA. */
      (function () {
        var isPwa =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.matchMedia("(display-mode: fullscreen)").matches ||
          window.matchMedia("(display-mode: minimal-ui)").matches ||
          window.matchMedia("(display-mode: window-controls-overlay)").matches ||
          window.navigator.standalone === true;
        if (isPwa) document.documentElement.classList.add("sul-pwa");
      })();
      /* Emergency SW/cache bust when a prior shell left the app blank. */
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.get("reset") !== "1") return;
          var done = function () {
            params.delete("reset");
            var q = params.toString();
            window.location.replace(
              window.location.pathname + (q ? "?" + q : "") + window.location.hash
            );
          };
          var tasks = [];
          if ("serviceWorker" in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              })
            );
          }
          if ("caches" in window) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
            );
          }
          try {
            localStorage.removeItem("sul-admin-build-id");
            sessionStorage.clear();
          } catch (e) {}
          Promise.all(tasks).then(done).catch(done);
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
      }
      /* Brand boot background only in installed PWA. */
      html.sul-pwa:not(.sul-booted),
      html.sul-pwa:not(.sul-booted) body {
        background: #166a82;
      }
      #sul-boot-splash {
        display: none;
      }
      html.sul-pwa #sul-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #166a82;
        color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.32s ease, visibility 0.32s ease;
      }
      #sul-boot-splash.sul-boot-splash--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #sul-boot-splash .sul-boot-logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        object-fit: contain;
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
        animation: sul-boot-pulse 1.4s ease-in-out infinite;
      }
      #sul-boot-splash .sul-boot-title {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #sul-boot-splash .sul-boot-sub {
        margin: 0;
        font-size: 0.8rem;
        font-weight: 500;
        opacity: 0.78;
      }
      @keyframes sul-boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.04);
          opacity: 0.88;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #sul-boot-splash .sul-boot-logo {
          animation: none;
        }
        #sul-boot-splash {
          transition: none;
        }
      }
      /* Critical mobile nav — survives a brief moment before the main CSS bundle. */
      @media (max-width: 47.99em) {
        .sul-mobile-nav-v4 {
          position: fixed !important;
          left: 0 !important;
          right: 0 !important;
          bottom: max(8px, env(safe-area-inset-bottom, 0px)) !important;
          margin: 0 !important;
          padding: 0 !important;
          background: transparent !important;
          background-color: transparent !important;
          box-shadow: none !important;
          border: none !important;
          pointer-events: none !important;
          z-index: 1000 !important;
          height: auto !important;
          min-height: 0 !important;
          max-height: none !important;
          transform: none !important;
        }
        .sul-mobile-nav-v4 nav {
          pointer-events: auto !important;
          margin: 0 12px !important;
        }
        .sul-mobile-nav-v3,
        .sul-mobile-nav-v2,
        .mobile-bottom-nav-root {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="sul-boot-splash" role="status" aria-live="polite" aria-label="Loading SUL Bix">
      <img
        class="sul-boot-logo"
        src="/admin/logo.png"
        width="88"
        height="88"
        alt=""
        decoding="async"
      />
      <p class="sul-boot-title">SUL Bix</p>
      <p class="sul-boot-sub">Loading…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
