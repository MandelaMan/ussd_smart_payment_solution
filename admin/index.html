<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/admin/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#166a82" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SUL Bix" />
    <link rel="apple-touch-icon" href="/admin/pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

      onload="this.media='all'"

      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>SUL Bix</title>
    <style>
      /* Critical mobile nav — survives a brief moment before the main CSS bundle. */
      @media (max-width: 47.99em) {
        .sul-mobile-nav-v2 {
          position: fixed !important;
          left: 0 !important;
          right: 0 !important;
          bottom: 0 !important;
          padding: 0 0 8px 0 !important;
          background: transparent !important;
          pointer-events: none !important;
          z-index: 1000 !important;
        }
        .sul-mobile-nav-v2 nav {
          pointer-events: auto !important;
          margin: 0 12px !important;
        }
      }
    </style>
  </head>
