<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact us — Starlynx</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cerulean: #166a82;
        --cerulean-deep: #0e4858;
        --pale-azure: #6dcff6;
        --mindaro: #eaeeab;
        --sandy: #f9a456;
        --ink: #0a3744;
        --muted: #4a6b75;
        --panel: rgba(255, 255, 255, 0.92);
        --line: rgba(22, 106, 130, 0.18);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(109, 207, 246, 0.45), transparent 60%),
          radial-gradient(900px 500px at 100% 0%, rgba(234, 238, 171, 0.55), transparent 55%),
          linear-gradient(160deg, #f3fafc 0%, #e8f4f8 45%, #f7f9ef 100%);
      }
      .wrap {
        max-width: 520px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }
      .brand {
        font-family: Fraunces, Georgia, serif;
        font-size: 2rem;
        font-weight: 700;
        color: var(--cerulean-deep);
        letter-spacing: -0.02em;
        margin: 0 0 8px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 28px;
        line-height: 1.5;
        font-size: 1.02rem;
      }
      form {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 24px;
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 50px rgba(14, 72, 88, 0.08);
      }
      label {
        display: block;
        font-size: 0.82rem;
        font-weight: 600;
        margin: 0 0 6px;
        color: var(--cerulean-deep);
      }
      .field { margin-bottom: 14px; }
      .hp { position: absolute; left: -9999px; opacity: 0; height: 0; overflow: hidden; }
      input, select, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 11px 12px;
        font: inherit;
        background: #fff;
        color: var(--ink);
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--cerulean);
        box-shadow: 0 0 0 3px rgba(22, 106, 130, 0.15);
      }
      textarea { min-height: 96px; resize: vertical; }
      button {
        width: 100%;
        margin-top: 8px;
        border: 0;
        border-radius: 999px;
        padding: 13px 18px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, var(--cerulean) 0%, var(--cerulean-deep) 100%);
        cursor: pointer;
      }
      button:disabled { opacity: 0.65; cursor: wait; }
      .alt {
        margin-top: 18px;
        text-align: center;
        font-size: 0.92rem;
        color: var(--muted);
      }
      .alt a {
        color: var(--cerulean);
        font-weight: 600;
        text-decoration: none;
      }
      .msg {
        display: none;
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 0.95rem;
        line-height: 1.4;
      }
      .msg.ok {
        display: block;
        background: rgba(234, 238, 171, 0.65);
        color: var(--cerulean-deep);
      }
      .msg.err {
        display: block;
        background: rgba(249, 164, 86, 0.25);
        color: #8a3b00;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 class="brand" id="brand">Starlynx</h1>
      <p class="sub" id="subtitle">Tell us a bit about yourself and we will get back to you shortly.</p>
      <form id="lead-form" novalidate>
        <div class="hp" aria-hidden="true">
          <label>Company website</label>
          <input type="text" name="companyWebsite" tabindex="-1" autocomplete="off" />
        </div>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" required autocomplete="name" />
        </div>
        <div class="field">
          <label for="phone">Phone (WhatsApp preferred)</label>
          <input id="phone" name="phone" required autocomplete="tel" placeholder="07XX XXX XXX" />
        </div>
        <div class="field">
          <label for="email">Email (optional)</label>
          <input id="email" name="email" type="email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="interest">Interest</label>
          <select id="interest" name="interest"></select>
        </div>
        <div class="field">
          <label for="building">Building / estate (optional)</label>
          <input id="building" name="buildingInterest" autocomplete="off" />
        </div>
        <div class="field">
          <label for="message">Message (optional)</label>
          <textarea id="message" name="message" placeholder="Anything we should know?"></textarea>
        </div>
        <button type="submit" id="submit">Send request</button>
        <div class="msg" id="feedback" role="status"></div>
      </form>
      <p class="alt" id="wa-wrap" hidden>
        Prefer WhatsApp?
        <a id="wa-link" href="#" target="_blank" rel="noopener">Chat with us</a>
      </p>
    </div>
    <script>
      (function () {
        var API = "/api/public/leads";
        var form = document.getElementById("lead-form");
        var feedback = document.getElementById("feedback");
        var submit = document.getElementById("submit");
        var interest = document.getElementById("interest");

        function show(type, text) {
          feedback.className = "msg " + type;
          feedback.textContent = text;
        }

        fetch(API + "/config")
          .then(function (r) { return r.json(); })
          .then(function (cfg) {
            if (cfg.brandName) document.getElementById("brand").textContent = cfg.brandName;
            if (cfg.title) document.title = cfg.title;
            if (cfg.subtitle) document.getElementById("subtitle").textContent = cfg.subtitle;
            (cfg.interests || []).forEach(function (item) {
              var opt = document.createElement("option");
              opt.value = item.value;
              opt.textContent = item.label;
              interest.appendChild(opt);
            });
            if (cfg.whatsappLink) {
              document.getElementById("wa-wrap").hidden = false;
              document.getElementById("wa-link").href = cfg.whatsappLink;
            }
          })
          .catch(function () {
            ["Home Internet", "Internet + DSTV", "Business", "Other"].forEach(function (v) {
              var opt = document.createElement("option");
              opt.value = v;
              opt.textContent = v;
              interest.appendChild(opt);
            });
          });

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          submit.disabled = true;
          feedback.className = "msg";
          var data = {
            source: "web",
            name: form.name.value,
            phone: form.phone.value,
            email: form.email.value,
            interest: form.interest.value,
            buildingInterest: form.buildingInterest.value,
            message: form.message.value,
            companyWebsite: form.companyWebsite.value,
            pageUrl: window.location.href,
          };
          fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Lead-Source": "web" },
            body: JSON.stringify(data),
          })
            .then(function (r) {
              return r.json().then(function (body) {
                if (!r.ok) throw new Error(body.error || "Submission failed");
                return body;
              });
            })
            .then(function (body) {
              form.reset();
              show("ok", body.message || "Thanks! We will contact you soon.");
            })
            .catch(function (err) {
              show("err", err.message || "Something went wrong");
            })
            .finally(function () {
              submit.disabled = false;
            });
        });
      })();
    </script>
  </body>
</html>
